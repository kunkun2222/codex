<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0e"><title>归宅 · 秋夜</title><link rel="stylesheet" href="play.css"></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-phone" viewBox="0 0 32 32"><rect x="8" y="2" width="16" height="28" rx="3"/><path d="M12 5h8M11 9h10v10H11zM11 23h2m6 0h2m-10 3h2m6 0h2m-6-3h2m-2 3h2"/></symbol>
<symbol id="i-case" viewBox="0 0 32 32"><rect x="3" y="10" width="26" height="18" rx="2"/><path d="M11 10V5h10v5M3 17h26M11 15v5m10-5v5"/></symbol>
<symbol id="i-note" viewBox="0 0 32 32"><rect x="6" y="4" width="22" height="25" rx="2"/><path d="M11 4v25M3 9h6m-6 7h6m-6 7h6m7-14h8m-8 6h8m-8 6h5"/></symbol>
<symbol id="i-light" viewBox="0 0 32 32"><path d="m12 13 7 7-8 9-8-8 9-8zm0 0 1-7 5-4 12 12-4 5-7 1M16 7l9 9"/></symbol>
</defs></svg>
<main class="game-shell">
<section id="startScreen" class="start-screen" aria-label="开始界面">
<div class="start-shade"></div><a class="gallery-link" href="gallery.html">场景画廊 ↗</a>
<div class="start-content"><p class="overline">一栋老宅。一个不该在这里的人。</p><h1>归<span>宅</span></h1><p class="subtitle">秋 夜</p><button id="startGame" class="start-button">开始游戏 <span>→</span></button><p class="start-hint">点击探索 · 简短试玩</p></div>
<p class="start-footer">虚构故事 · 当前无音效</p>
</section>
<section id="gameScreen" class="game-screen" aria-label="游戏场景" hidden>
<header class="hud"><button id="home" class="wordmark" aria-label="返回开始界面">归宅<span>秋夜</span></button><div><span id="sceneLabel"></span><span class="separator">/</span><time id="clock"></time></div><a href="gallery.html" aria-label="查看场景画廊">画廊 ↗</a></header>
<div class="stage-wrap"><section id="stage" class="stage" aria-label="可探索的画面"><div id="backdrop" class="backdrop"></div><div class="vignette"></div><div id="hotspots" class="hotspots"></div><span id="artNotice" class="art-notice" hidden>室内早期概念 · 待重绘</span>
<section class="narration" aria-label="故事旁白"><p id="chapter" class="chapter"></p><h2 id="title"></h2><p id="description" aria-live="polite"></p><div id="actions" class="actions"></div><p id="feedback" role="status"></p></section></section></div>
<footer class="toolbar"><span class="toolbar-hint">点击画面中的标记探索</span><nav aria-label="随身工具栏"><button id="phoneButton" class="tool" aria-haspopup="dialog"><svg><use href="#i-phone"/></svg><span>手机</span><i id="unread" class="unread"></i></button><button id="inventoryButton" class="tool" aria-haspopup="dialog"><svg><use href="#i-case"/></svg><span>工具箱</span><small id="capacity">0/4</small></button><button id="notesButton" class="tool" aria-haspopup="dialog"><svg><use href="#i-note"/></svg><span>备忘录</span></button></nav><button id="hintToggle" class="hint-toggle" aria-pressed="true">标记：开</button></footer>
</section>
</main>
<dialog id="panel" aria-labelledby="panelTitle"><header class="panel-header"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="关闭面板">关闭 ×</button></header><div id="panelBody"></div></dialog>
<script src="demo.js"></script></body></html>
